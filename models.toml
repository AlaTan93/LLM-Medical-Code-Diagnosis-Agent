# Models to pre-populate the in-container Ollama with when the GPU stack comes
# up. Read by the `ollama-init` sidecar in docker/docker-compose.gpu.yml, which
# polls http://ollama:11434 until the GPU Ollama is ready, then POSTs /api/pull
# for each entry below (in parallel with the app), skipping any already present.
#
# Each [[model]] block pulls a model from the Ollama registry by tag. `name` is
# both the registry tag and the local Ollama name. Re-runs are idempotent.

[[model]]
name = "hf.co/rwibawa/DeepSeek-R1-Medical-COT:Q4_K_M"

[[model]]
name = "hf.co/Intelligent-Internet/II-Medical-8B-1706-GGUF:Q8_0"

[[model]]
name = "hf.co/qaootkcx/qwen35-9b-medical:Q4_K_M"

# Embedding model for ICD-10 vector similarity search (1024-dim, pgvector).
[[model]]
name = "bge-m3"

# Generalist orchestrator for the /code pipeline (strong tool-caller).
[[model]]
name = "qwen2.5:7b"

