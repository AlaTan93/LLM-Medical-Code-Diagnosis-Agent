# medicoder-technical
#
# Default (3 containers): docker compose up --build
#   postgres + medicoder + litellm
#
# LiteLLM is always hosted locally. It routes the model alias the app calls
# (e.g. "A") to an upstream LLM configured in .env — any OpenAI-compatible
# endpoint works: a cloud provider (OpenAI, Anthropic, Azure), a self-deployed
# server (vLLM, TGI), or an Ollama you run on the host
# (LLM_UPSTREAM_API_BASE=http://host.docker.internal:11434).
# Every call + response is audited to Postgres (LiteLLM_SpendLogs).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medicoder}
      # Handed to the init scripts in docker/postgres.
      MEDICODER_PASSWORD: ${MEDICODER_PASSWORD:?set MEDICODER_PASSWORD in .env}
      AGENT_PASSWORD: ${AGENT_PASSWORD:?set AGENT_PASSWORD in .env}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medicoder}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  litellm:
    # Local proxy: routes the app's model alias ("A") to the upstream LLM and
    # audits every call/response to Postgres (LiteLLM_SpendLogs via DATABASE_URL
    # + Prisma migration on first boot).
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
      - ./docker/litellm/log_callback.py:/app/log_callback.py:ro
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD in .env}@postgres:5432/litellm
      # Upstream the alias "A" resolves to (see docker/litellm/config.yaml).
      # Use a LiteLLM provider prefix, e.g. openai/gpt-4o-mini, anthropic/claude-...
      LLM_UPSTREAM_MODEL: ${LLM_UPSTREAM_MODEL:?set LLM_UPSTREAM_MODEL in .env}
      LLM_UPSTREAM_API_BASE: ${LLM_UPSTREAM_API_BASE:?set LLM_UPSTREAM_API_BASE in .env}
      LLM_UPSTREAM_API_KEY: ${LLM_UPSTREAM_API_KEY:?set LLM_UPSTREAM_API_KEY in .env}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--host"
      - "0.0.0.0"
    # No host port published: LiteLLM is in-network only (reachable as
    # http://litellm:4000/v1 by the medicoder app), so the only public way to
    # reach the models is through the app's POST /test/{model} endpoint.
    # The healthcheck below is intra-container (localhost:4000) and still works.
    # Lets the proxy reach an LLM you run on the host (e.g. a local Ollama).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # curl-free (the image may not ship curl); /health/liveliness returns 200 fast.
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  medicoder:
    build:
      context: .
      dockerfile: Dockerfile
    # The loader connects as the read/write medicoder role.
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-medicoder}
      PGUSER: medicoder
      PGPASSWORD: ${MEDICODER_PASSWORD:?set MEDICODER_PASSWORD in .env}
      ICD10_FILE: /app/icd10cm_order_2026.txt
      # Points at the local LiteLLM proxy (alias -> upstream LLM).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      # LLM proxy timeouts & token limits (medicoder/proxy.py).
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-300.0}
      EMBED_TIMEOUT: ${EMBED_TIMEOUT:-120.0}
      MAX_TOKENS: ${MAX_TOKENS:-8192}
      # Diagnose pipeline (medicoder/medical.py).
      MAX_DIAGNOSES: ${MAX_DIAGNOSES:-10}
      DIAGNOSE_MAX_RETRIES: ${DIAGNOSE_MAX_RETRIES:-4}
      DIAGNOSE_TEMP_INCREMENT: ${DIAGNOSE_TEMP_INCREMENT:-0.05}
      DIAGNOSE_MAX_TEMP: ${DIAGNOSE_MAX_TEMP:-0.3}
      DIAGNOSE_MAX_TOKENS: ${DIAGNOSE_MAX_TOKENS:-4096}
      DIAGNOSE_CONCISE_TOKENS: ${DIAGNOSE_CONCISE_TOKENS:-2048}
      # Debate-critic loop (medicoder/critic.py + diagnose.py).
      MODEL_A: ${MODEL_A:-medgemma-27b-q4_k_s}
      MODEL_B: ${MODEL_B:-deepseek-r1-medical-cot}
      CRITIC_MODEL: ${CRITIC_MODEL:-medgemma-27b-q4_k_s}
      MAX_CRITIC_ROUNDS: ${MAX_CRITIC_ROUNDS:-2}
      CRITIC_TEMP: ${CRITIC_TEMP:-0.25}
      CRITIC_MAX_TOKENS: ${CRITIC_MAX_TOKENS:-8192}
      # Search tuning (medicoder/medical.py — hybrid vector + FTS).
      FTS_BOOST: ${FTS_BOOST:-0.0}
      FTS_FLOOR: ${FTS_FLOOR:-0.50}
      SEARCH_CANDIDATE_MULT: ${SEARCH_CANDIDATE_MULT:-5}
      # Embedding batch size (medicoder/db/embed_icd10.py).
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-128}
      # DeepAgent models are reached via LangChain's `openai:` provider, which
      # reads OPENAI_BASE_URL / OPENAI_API_KEY. LiteLLM enforces no key, so a
      # dummy value is fine; base URL mirrors LLM_BASE_URL.
      OPENAI_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: dummy
    ports:
      - "8000:8000"
    volumes:
      # Read-only ICD-10 source data. The app reads data/... (relative);
      # this mount restores the host's data/ layout that COPY flattens in the image.
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
