[project]
name = "medicoder-technical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6.12",
    "fastapi>=0.140.0",
    "langchain-openai>=1.4.1",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.51.0",
]

# Debug-only tools. Excluded from the production image (Dockerfile uses
# `uv sync --no-dev`); installed into the container only by the debug compose
# override (docker/docker-compose.debug.yml).
[dependency-groups]
dev = [
    "debugpy>=1.8",
]
