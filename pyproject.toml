[project]
name = "medicoder-technical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.51.0",
]

# Debug-only tools. Excluded from the production image (Dockerfile uses
# `uv sync --no-dev`); installed into the container only by the debug compose
# override (docker/docker-compose.debug.yml).
[dependency-groups]
dev = [
    "debugpy>=1.8",
]
# Host-side model pre-pull script (pull_models_before_build.py). NEVER installed
# into any image: the Dockerfile uses `--no-dev` (excludes `dev`) and never
# passes `--group bootstrap`, and named groups aren't installed by default.
# Run on the host via: uv run --group bootstrap python pull_models_before_build.py
bootstrap = [
    "huggingface_hub>=0.25",
    "requests>=2.31",
]
