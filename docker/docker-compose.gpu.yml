# Optional in-container GPU Ollama for the medicoder stack.
#
# Loaded ON TOP of docker-compose.yml (+ docker-compose.debug.yml for the debug
# flow) to run the LLM locally on a GPU instead of a cloud/host endpoint. Two
# mutually-exclusive Ollama services, selected by compose profile; each answers
# to the network alias `ollama`, so the litellm override below can target
# http://ollama:11434 regardless of which GPU vendor is active.
#
#   AMD (ROCm):    docker compose -f docker-compose.yml \
#                        -f docker/docker-compose.gpu.yml --profile gpu-amd up
#   NVIDIA (CUDA): docker compose -f docker-compose.yml \
#                        -f docker/docker-compose.gpu.yml --profile gpu-nvidia up
#
# Default stack stays env-only (cloud / host Ollama); this file is opt-in.
#
# ollama-init auto-pulls every `ollama`-kind entry in models.toml when the stack
# comes up (profiles gpu-amd / gpu-nvidia). It polls http://ollama:11434 until
# whichever GPU Ollama is ready, then POSTs /api/pull, skipping anything already
# present. Fire-and-forget: nothing depends on it, so models arrive in parallel
# with the medicoder app. kind=hf entries are not handled here (use the host
# pull_models_before_build.py for HF GGUF imports).
# For a one-off manual pull:
#   docker compose -f docker-compose.yml -f docker/docker-compose.gpu.yml \
#       --profile gpu-amd exec ollama-amd ollama pull llama3.2
#   (use ollama-nvidia and --profile gpu-nvidia on the CUDA box)

services:
  ollama-amd:
    image: ollama/ollama:rocm
    profiles: ["gpu-amd"]
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11433:11434"
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped

  ollama-nvidia:
    image: ollama/ollama:latest
    profiles: ["gpu-nvidia"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11433:11434"
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped

  # One-shot sidecar: auto-pulls every `ollama`-kind entry in models.toml into
  # the running Ollama when the stack comes up. Stdlib-only script (no pip
  # installs); polls http://ollama:11434 so it works under either GPU profile
  # without a depends_on. Fire-and-forget (nothing depends on it).
  ollama-init:
    image: python:3.13-slim
    profiles: ["gpu-amd", "gpu-nvidia"]
    volumes:
      - ./models.toml:/models.toml:ro
      - ./docker/program/pull_models.py:/pull_models.py:ro
    environment:
      OLLAMA_BASE_URL: http://ollama:11433
    command: ["python", "/pull_models.py"]
    restart: "no"

  # Whenever this overlay is loaded, repoint LiteLLM's alias at the local
  # Ollama (whichever GPU service is active via its profile). These env vars
  # override the .env values set on the base litellm service.
  litellm:
    environment:
      LLM_UPSTREAM_MODEL: ollama/${OLLAMA_MODEL:-llama3.2}
      LLM_UPSTREAM_API_BASE: http://ollama:11433
      LLM_UPSTREAM_API_KEY: dummy

volumes:
  ollama-models:
