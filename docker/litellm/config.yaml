# LiteLLM proxy configuration.
#
# - Routes the model name your app calls ("A", "B", "C", ...) to an upstream
#   LLM. The upstream is configured entirely via environment variables set on
#   the litellm container (see .env: LLM_UPSTREAM_MODEL / _API_BASE / _API_KEY),
#   so you can point at a cloud provider (OpenAI, Anthropic, Azure), a
#   self-deployed server (vLLM, TGI), or an Ollama you run on the host
#   (LLM_UPSTREAM_API_BASE=http://host.docker.internal:11434) without editing
#   this file.
# - Writes a full audit (request messages + response, tokens, cost, latency) to
#   Postgres (LiteLLM_SpendLogs table) via DATABASE_URL. Message logging is ON
#   by default; do NOT set turn_off_message_logging if you want the payloads.

model_list:
  # The app calls model "A"; LiteLLM forwards to LLM_UPSTREAM_MODEL at
  # LLM_UPSTREAM_API_BASE, authenticating with LLM_UPSTREAM_API_KEY.
  # Use a LiteLLM provider prefix, e.g. openai/gpt-4o-mini,
  # anthropic/claude-3-5-sonnet, ollama/llama3.2.
  - model_name: A
    litellm_params:
      model: os.environ/LLM_UPSTREAM_MODEL
      api_base: os.environ/LLM_UPSTREAM_API_BASE
      api_key: os.environ/LLM_UPSTREAM_API_KEY

  # In-container Ollama medical models (gpu-amd / gpu-nvidia profiles).
  # Hardcoded to http://ollama:11434 — dormant in cloud mode (errors only if
  # called). LiteLLM splits the provider on the first "/", so e.g.
  # ollama/hf.co/...:Q8_0 -> provider=ollama, model=hf.co/...:Q8_0.
  - model_name: deepseek-r1-medical-cot
    litellm_params:
      model: ollama/rwibawa/DeepSeek-R1-Medical-COT:Q4_K_M
      api_base: http://ollama:11434
      api_key: dummy
  - model_name: ii-medical-q8
    litellm_params:
      model: ollama/hf.co/Intelligent-Internet/II-Medical-8B-1706-GGUF:Q8_0
      api_base: http://ollama:11434
      api_key: dummy
  - model_name: qwen35-medical
    litellm_params:
      model: ollama/hf.co/qaootkcx/qwen35-9b-medical:Q4_K_M
      api_base: http://ollama:11434
      api_key: dummy

litellm_settings:
  drop_params: true

general_settings:
  # Postgres-backed audit store (DATABASE_URL is set on the litellm container).
  database_url: os.environ/DATABASE_URL
